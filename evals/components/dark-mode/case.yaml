schema_version: "1.1"
name: dark-mode
description: >-
  Dark mode with a toggle. Head(dark_theme=...) and ColorSchemeToggle do it
  without hand-written media queries or JavaScript.
tags: [components, theming]
expected_outcome: >-
  Head(..., dark_theme=DarkTheme()) and a ColorSchemeToggle on the page.
execution:
  prompt: |-
    Add a dark mode to the page in `app.py`. It should follow the system
    setting, and visitors should be able to switch it with a button.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: setup.sh
graders:
  - name: head-with-dark-theme
    type: regex
    target: { source: file, path: app.py }
    pattern: |-
      \bdark_theme\s*=
  - name: uses-color-scheme-toggle
    type: regex
    target: { source: file, path: app.py }
    pattern: |-
      \bColorSchemeToggle\(
  - name: no-hand-written-media-query
    type: regex
    target: { source: file, path: app.py }
    match: not_contains
    pattern: |-
      @media\s*\(\s*prefers-color-scheme
  - name: no-hand-written-script
    type: regex
    target: { source: file, path: app.py }
    match: not_contains
    pattern: |-
      localStorage
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: |-
      "skill"\s*:\s*"(?:[\w-]+:)?ludic-components"
