schema_version: "1.1"
name: brand-theme
description: >-
  Branding an app. Colors, fonts and the width of the sidebar are theme
  settings: colors.primary, fonts.secondary for headings, fonts.primary for
  text and layouts.sidebar.side_width.
tags: [components, theming]
expected_outcome: >-
  A theme with Colors(primary=...), Fonts(primary=..., secondary=...) and
  Layouts(sidebar=Sidebar(side_width=...)), made the default with
  set_default_theme, and no CSS.
execution:
  prompt: |-
    Apply our brand to the app in `app.py`. Our primary color is #7c3aed,
    headings use the "Playfair Display" font and the rest of the text uses
    "Inter". Make the sidebar 18rem wide.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: setup.sh
graders:
  - name: sets-primary-color
    type: regex
    target: { source: file, path: app.py }
    pattern: |-
      \bColors\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\bprimary\s*=
  - name: sets-heading-font
    type: regex
    target: { source: file, path: app.py }
    pattern: |-
      \bFonts\((?:[^()]|\([^()]*\))*\bsecondary\s*=
  - name: sets-text-font
    type: regex
    target: { source: file, path: app.py }
    pattern: |-
      \bFonts\((?:[^()]|\([^()]*\))*\bprimary\s*=
  - name: sets-sidebar-width
    type: regex
    target: { source: file, path: app.py }
    pattern: |-
      \bside_width\s*=
  - name: sets-default-theme
    type: regex
    target: { source: file, path: app.py }
    pattern: |-
      \bset_default_theme\(
  - name: no-css
    type: regex
    target: { source: file, path: app.py }
    match: not_contains
    pattern: |-
      \bstyles\s*=|\bstyle\s*=\s*\{|\bstyle\(\s*[{"']|font-family
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: |-
      "skill"\s*:\s*"(?:[\w-]+:)?ludic-components"
